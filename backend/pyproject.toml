[project]
name = "pgplanadvisor"
version = "2.0.0"
description = "PostgreSQL EXPLAIN ANALYZE advisor: bottleneck detection and remediation checklists for DBAs."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.14.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length is handled by the formatter/line-length setting, not worth failing CI over.
# B008: FastAPI's `Depends(...)` in a default argument is the documented, idiomatic pattern -
# https://fastapi.tiangolo.com/tutorial/dependencies/ - not the antipattern this rule targets.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["tests/"]
