services:
  backend:
    build: ./backend
    container_name: pgplanadvisor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Uncomment / set to change behavior. See README.md "Configuration" for the full list.
      # - PGPA_API_KEY=change-me
      - PGPA_HISTORY_ENABLED=${PGPA_HISTORY_ENABLED:-false}
      - PGPA_HISTORY_DB_PATH=/app/data/pgplanadvisor.db
      - PGPA_LOG_LEVEL=${PGPA_LOG_LEVEL:-INFO}
      - PGPA_CORS_ORIGINS=${PGPA_CORS_ORIGINS:-["http://localhost:5173"]}
    volumes:
      - ./logs/backend:/var/log/pgplanadvisor/backend
      - ./data/backend:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build: ./frontend
    container_name: pgplanadvisor-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./logs/frontend:/var/log/pgplanadvisor/frontend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
